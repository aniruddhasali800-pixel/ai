# Render Blueprint — one web service hosts the API and the built React app.
# `npm run build` in backend/ bundles the server and builds ../frontend/dist, which
# the API then serves, so the default Node build and start commands are enough.
# Render publishes the service's own URL through RENDER_EXTERNAL_URL, and the config
# reads it for the CORS allowlist and for the host baked into QR codes and guest
# links — so there is nothing to type here except the database connection string.
services:
  - type: web
    name: sizzle
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      # Atlas (or any reachable MongoDB). Required in production, and required at all
      # if you want to seed from a Render shell — an in-container database cannot be
      # reached from the shell's own filesystem.
      - key: MONGODB_URI
        sync: false
