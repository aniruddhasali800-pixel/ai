# Render Blueprint — one web service hosts the API and the built React app.
# Blueprints cannot interpolate a service's own URL, so the three keys marked
# `sync: false` are prompts at create time: the Atlas connection string, and your
# service URL twice (once as the CORS/socket allowlist, once as the host printed
# into table QR codes and guest bill links).
services:
  - type: web
    name: sizzle
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    # Build the API bundle, then the client it serves from ../frontend/dist.
    buildCommand: npm install && npm run build && cd ../frontend && npm install && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: MONGODB_URI
        sync: false
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: STATIC_DIR
        value: ../frontend/dist
